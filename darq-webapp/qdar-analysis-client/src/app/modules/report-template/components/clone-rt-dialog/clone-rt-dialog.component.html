<h2 mat-dialog-title>Clone Report Template</h2>
<form>
  <div class="form-group">
    <label for="name"><strong>Name: [Clone] {{" " + template.name}}</strong></label>
  </div>
  <div class="form-group">
    <label for="configuration"><strong>Select Configuration</strong></label>
    <p-dropdown name="configuration" [options]="configurations" [autoDisplayFirst]="false" [(ngModel)]="configurationId"
      [style]="{ 'width' : '100%' }" appendTo="body">
      <ng-template let-configuration pTemplate="selectedItem">
        <app-descriptor-display [descriptor]="configuration.descriptor"></app-descriptor-display>
      </ng-template>
      <ng-template let-configuration pTemplate="item">
        <app-descriptor-display [descriptor]="configuration.descriptor"></app-descriptor-display>
      </ng-template>
    </p-dropdown>
  </div>
</form>

<mat-dialog-actions style="justify-content: flex-end;">
  <button (click)="cancel()" class="btn btn-sm btn-secondary" style="margin-right: 5px;">Cancel</button>
  <button [disabled]="!valid()" (click)="clone()" class="btn btn-sm btn-success">Clone</button>
</mat-dialog-actions>
